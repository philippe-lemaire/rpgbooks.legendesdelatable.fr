{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% block title %}My RPG Books{% endblock title %}
{% block content %}
<h1>Systems</h1>
<div class="container">
  <div class="row">
    <div class="col">
      <ul class="list-group mt-5">

        {% for system in system_list %}

        <li class="list-group-item d-flex justify-content-between align-items-center">
          <a href="{% url 'books:books_by_system' system.slug %}">{{system}}</a>
          <span class="badge badge-primary badge-pill">{{system.books_count}}</span>
        </li>
        {% endfor %}
      </ul>
    </div>
    <div class="col"></div>
  </div>
</div>
{% endblock %}
