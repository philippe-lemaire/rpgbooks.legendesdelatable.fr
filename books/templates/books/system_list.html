{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% block title %}My RPG Books{% endblock title %}
{% block content %}
<h1>Systems</h1>

<ul>
  {% for system in system_list %}
  <li>
    <a href="{% url 'books:books_by_system' system.slug %}">{{system}}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
